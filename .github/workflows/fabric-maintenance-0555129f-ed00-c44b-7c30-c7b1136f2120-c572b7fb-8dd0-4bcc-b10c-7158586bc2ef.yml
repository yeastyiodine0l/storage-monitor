# Managed by Actions Fabric maintenance; version 2
name: Fabric maintenance c572b7fb-8dd0-4bcc-b10c-7158586bc2ef
run-name: Fabric maintenance c572b7fb-8dd0-4bcc-b10c-7158586bc2ef
on:
  workflow_dispatch: {}
  schedule:
    - cron: 4,9,14,19,24,29,34,39,44,49,54,59 * * * *
permissions:
  contents: read
concurrency:
  group: fabric-maintenance-c572b7fb-8dd0-4bcc-b10c-7158586bc2ef
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 1
