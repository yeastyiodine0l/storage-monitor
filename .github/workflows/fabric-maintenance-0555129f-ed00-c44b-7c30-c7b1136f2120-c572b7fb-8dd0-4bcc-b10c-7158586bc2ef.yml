          tee "$RUNNER_TEMP/fabric-maintenance-check.txt"
      - name: Retain maintenance environment evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fabric-maintenance-c572b7fb-8dd0-4bcc-b10c-7158586bc2ef
          path: ${{ runner.temp }}/fabric-maintenance-check.txt
          retention-days: 1
          if-no-files-found: error
